<header class="sticky top-0 z-50 backdrop-blur-md bg-canvas/80 border-b border-white/10">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex items-center justify-between h-16">
      
      <!-- Brand Logo -->
      <div class="flex items-center gap-3">
        <a routerLink="/events" class="flex items-center gap-2 text-xl font-bold tracking-tight text-white group">
          <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-brand-primary to-brand-accent flex items-center justify-center shadow-lg shadow-brand-primary/20 group-hover:scale-105 transition-transform">
            <svg class="w-5 h-5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 5v2m0 4v2m0 4v2M5 5a2 2 0 00-2 2v3a2 2 0 110 4v3a2 2 0 002 2h14a2 2 0 002-2v-3a2 2 0 110-4V7a2 2 0 00-2-2H5z" />
            </svg>
          </div>
          <span>Sob<span class="text-brand-accent">Events</span></span>
        </a>

        <!-- Desktop Links -->
        <nav class="hidden md:flex items-center gap-1 ml-8">
          <a routerLink="/events" 
             routerLinkActive="bg-white/10 text-white" 
             [routerLinkActiveOptions]="{ exact: true }"
             class="px-3 py-2 rounded-lg text-sm font-medium text-gray-300 hover:text-white hover:bg-white/5 transition-colors">
            Discover Events
          </a>
          <a routerLink="/my-reservations" 
             routerLinkActive="bg-white/10 text-white" 
             class="px-3 py-2 rounded-lg text-sm font-medium text-gray-300 hover:text-white hover:bg-white/5 transition-colors">
            My Bookings
          </a>
          <a routerLink="/organizer/events" 
             routerLinkActive="bg-white/10 text-white" 
             class="px-3 py-2 rounded-lg text-sm font-medium text-gray-300 hover:text-white hover:bg-white/5 transition-colors flex items-center gap-1.5">
            <span class="w-2 h-2 rounded-full bg-emerald-400"></span>
            Organizer Studio
          </a>
        </nav>
      </div>

      <!-- Auth Actions -->
      <div class="hidden sm:flex items-center gap-3">
        <a routerLink="/login" 
           class="px-4 py-2 text-sm font-semibold text-gray-300 hover:text-white transition-colors">
          Sign In
        </a>
        <a routerLink="/register" 
           class="px-4 py-2 rounded-xl bg-brand-primary hover:bg-brand-primary-hover text-white text-sm font-semibold shadow-md shadow-brand-primary/25 hover:shadow-brand-primary/40 transition-all">
          Get Started
        </a>
      </div>

      <!-- Mobile Hamburger Button -->
      <div class="flex md:hidden">
        <button (click)="toggleMobileMenu()" 
                type="button" 
                class="p-2 rounded-lg text-gray-400 hover:text-white hover:bg-white/5 focus:outline-none"
                aria-label="Toggle Navigation">
          <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            @if (mobileMenuOpen()) {
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
            } @else {
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
            }
          </svg>
        </button>
      </div>

    </div>
  </div>

  <!-- Mobile Dropdown -->
  @if (mobileMenuOpen()) {
    <div class="md:hidden border-t border-white/10 bg-card px-4 pt-3 pb-5 space-y-2">
      <a routerLink="/events" (click)="closeMobileMenu()" class="block px-3 py-2 rounded-lg text-base font-medium text-gray-300 hover:text-white hover:bg-white/5">
        Discover Events
      </a>
      <a routerLink="/my-reservations" (click)="closeMobileMenu()" class="block px-3 py-2 rounded-lg text-base font-medium text-gray-300 hover:text-white hover:bg-white/5">
        My Bookings
      </a>
      <a routerLink="/organizer/events" (click)="closeMobileMenu()" class="block px-3 py-2 rounded-lg text-base font-medium text-gray-300 hover:text-white hover:bg-white/5">
        Organizer Studio
      </a>
      <div class="pt-4 border-t border-white/10 flex flex-col gap-2">
        <a routerLink="/login" (click)="closeMobileMenu()" class="w-full text-center py-2 text-sm font-semibold text-gray-300 hover:text-white">
          Sign In
        </a>
        <a routerLink="/register" (click)="closeMobileMenu()" class="w-full text-center py-2.5 rounded-xl bg-brand-primary text-white text-sm font-semibold">
          Get Started
        </a>
      </div>
    </div>
  }
</header>
