<header class="sticky top-0 z-50 bg-white/95 dark:bg-[#0B0F19]/95 backdrop-blur-md border-b border-gray-200/80 dark:border-white/10 transition-colors duration-200">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex items-center justify-between h-20">
      
      <!-- 1. Brand Logo (Using /logo.jpg from your public folder) -->
      <div class="flex items-center gap-8">
        <a routerLink="/events" class="flex items-center gap-3 group">
          <img src="/logo.jpg" alt="SobEvents Logo" class="w-10 h-10 rounded-xl object-cover shadow-sm group-hover:scale-105 transition-transform" />
          <div class="flex flex-col">
            <span class="text-xl font-extrabold tracking-tight text-gray-950 dark:text-white leading-none">
              Sob<span class="text-brand-accent">Events</span>
            </span>
            <span class="text-[10px] uppercase font-bold tracking-widest text-gray-400 dark:text-gray-500 mt-0.5">Addis Ababa</span>
          </div>
        </a>

        <!-- 2. Integrated Search Bar (Desktop) -->
        <div class="hidden lg:flex items-center relative w-80">
          <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-gray-400 dark:text-gray-500">
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
            </svg>
          </div>
          <input type="text" 
                 placeholder="Search events, venues, concerts..." 
                 class="w-full pl-10 pr-4 py-2 text-xs font-medium rounded-full bg-gray-100 dark:bg-gray-800/80 border border-transparent focus:border-brand-accent focus:bg-white dark:focus:bg-gray-900 text-gray-900 dark:text-white placeholder-gray-500 dark:placeholder-gray-400 focus:outline-none transition-all shadow-inner" />
        </div>
      </div>

      <!-- 3. Navigation Links -->
      <div class="hidden md:flex items-center gap-6">
        <nav class="flex items-center gap-1">
          <a routerLink="/events" 
             routerLinkActive="text-brand-accent font-bold"
             [routerLinkActiveOptions]="{ exact: true }"
             class="px-3.5 py-2 rounded-lg text-sm font-medium text-gray-600 dark:text-gray-300 hover:text-gray-950 dark:hover:text-white transition-colors">
            Explore Events
          </a>
          <a routerLink="/my-reservations" 
             routerLinkActive="text-brand-accent font-bold"
             class="px-3.5 py-2 rounded-lg text-sm font-medium text-gray-600 dark:text-gray-300 hover:text-gray-950 dark:hover:text-white transition-colors">
            My Bookings
          </a>
          <a routerLink="/organizer/events" 
             class="px-3.5 py-2 rounded-lg text-sm font-medium text-gray-600 dark:text-gray-300 hover:text-brand-accent transition-colors flex items-center gap-1.5">
            <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
            Host an Event
          </a>
        </nav>

        <div class="h-5 w-px bg-gray-200 dark:bg-gray-800"></div>

        <!-- 4. Night Mode Switcher Button -->
        <button (click)="themeService.toggleTheme()" 
                type="button" 
                class="p-2.5 rounded-full text-gray-500 hover:text-gray-900 dark:text-gray-400 dark:hover:text-white bg-gray-100 dark:bg-gray-800/80 hover:bg-gray-200 dark:hover:bg-gray-700 transition-all focus:outline-none"
                aria-label="Toggle Night Mode">
          @if (themeService.darkMode()) {
            <svg class="w-4 h-4 text-amber-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
            </svg>
          } @else {
            <svg class="w-4 h-4 text-gray-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
            </svg>
          }
        </button>

        <!-- 5. Auth Buttons -->
        <div class="flex items-center gap-2">
          <a routerLink="/login" 
             class="px-4 py-2 text-sm font-semibold text-gray-700 dark:text-gray-200 hover:text-brand-accent transition-colors">
            Sign In
          </a>
          <a routerLink="/register" 
             class="px-5 py-2.5 rounded-full bg-gray-900 hover:bg-black dark:bg-white dark:hover:bg-gray-100 text-white dark:text-gray-950 text-xs font-bold uppercase tracking-wider shadow-sm transition-all hover:shadow-md">
            Sign Up
          </a>
        </div>
      </div>

      <!-- Mobile Hamburger Button -->
      <div class="flex md:hidden items-center gap-2">
        <button (click)="themeService.toggleTheme()" 
                type="button" 
                class="p-2 rounded-full text-gray-500 bg-gray-100 dark:bg-gray-800">
          @if (themeService.darkMode()) {
            <svg class="w-4 h-4 text-amber-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
            </svg>
          } @else {
            <svg class="w-4 h-4 text-gray-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
            </svg>
          }
        </button>
        <button (click)="toggleMobileMenu()" class="p-2 rounded-lg text-gray-700 dark:text-gray-300">
          <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
          </svg>
        </button>
      </div>

    </div>
  </div>

  <!-- Mobile Dropdown Menu -->
  @if (mobileMenuOpen()) {
    <div class="md:hidden border-t border-gray-200 dark:border-white/10 bg-white dark:bg-[#111827] px-4 pt-3 pb-6 space-y-2 shadow-xl">
      <a routerLink="/events" (click)="closeMobileMenu()" class="block px-3 py-2.5 rounded-lg text-base font-medium text-gray-800 dark:text-gray-200 hover:bg-gray-100 dark:hover:bg-gray-800">
        Explore Events
      </a>
      <a routerLink="/my-reservations" (click)="closeMobileMenu()" class="block px-3 py-2.5 rounded-lg text-base font-medium text-gray-800 dark:text-gray-200 hover:bg-gray-100 dark:hover:bg-gray-800">
        My Bookings
      </a>
      <a routerLink="/organizer/events" (click)="closeMobileMenu()" class="block px-3 py-2.5 rounded-lg text-base font-medium text-gray-800 dark:text-gray-200 hover:bg-gray-100 dark:hover:bg-gray-800">
        Host an Event
      </a>
      <div class="pt-4 border-t border-gray-200 dark:border-gray-800 flex flex-col gap-2">
        <a routerLink="/login" (click)="closeMobileMenu()" class="w-full text-center py-2.5 text-sm font-semibold text-gray-800 dark:text-white">
          Sign In
        </a>
        <a routerLink="/register" (click)="closeMobileMenu()" class="w-full text-center py-3 rounded-full bg-brand-accent text-white text-xs font-bold uppercase tracking-wider">
          Sign Up
        </a>
      </div>
    </div>
  }
</header>
